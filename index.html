<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Architect AI - Portfolio Chatbot</title>
  <meta name="description" content="An interactive AI-like chat interface telling you everything about the developer's projects, skills, and background.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic light leaks for ambient background -->
  <div class="light-leak leak-1"></div>
  <div class="light-leak leak-2"></div>

  <!-- Simulated Mobile Screen Frame -->
  <div class="app-container" id="app">
    
    <!-- Phone Status Header -->
    <div class="phone-notch-container">
      <span class="time-label" id="current-time">09:41</span>
      <div class="camera-notch"></div>
      <div class="status-indicators" style="display: flex; gap: 6px;">
        <span>5G</span>
        <span>📶</span>
        <span>🔋 100%</span>
      </div>
    </div>

    <!-- Portfolio Chat Header -->
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-electric)">
            <rect x="3" y="11" width="18" height="10" rx="2" />
            <circle cx="12" cy="5" r="2" />
            <path d="M12 7v4M8 15h.01M16 15h.01" />
          </svg>
        </div>
        <div class="status-text-container">
          <h1 class="bot-name">Architect AI</h1>
          <span class="bot-status">System Online</span>
        </div>
      </div>
      
      <!-- Speaker Toggle & Reset Buttons -->
      <div style="display: flex; gap: 12px; align-items: center;">
        <div class="header-actions" id="speaker-toggle" title="Toggle Voice Responses" style="position: relative;">
          <!-- Speaker icon (initially active/unmuted) -->
          <svg id="speaker-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path id="speaker-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <div class="header-actions" id="reset-btn" title="Reset Conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main class="messages-container" id="messages-log">
      <!-- Welcome/First bot messages will be rendered here dynamically -->
    </main>

    <!-- Typing Indicator -->
    <div class="typing-indicator-container" id="typing-indicator">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Suggestion Chips Row -->
    <div class="quick-reply-wrapper" id="chips-container">
      <!-- Suggestion pills will be rendered here dynamically -->
    </div>

    <!-- Message Input Bar -->
    <form class="input-container" id="chat-form" autocomplete="off">
      <div class="chat-input-wrapper">
        <input type="text" class="chat-input" id="message-input" placeholder="Type a message or click a chip..." required>
      </div>
      <button type="button" class="voice-button" id="mic-btn" aria-label="Start voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"></path>
        </svg>
      </button>
      <button type="submit" class="send-button" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

  </div>

  <script type="module" src="app.js"></script>
  <script>
    // Phone status bar current time updating
    function updateClock() {
      const timeEl = document.getElementById('current-time');
      if (timeEl) {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hrs}:${mins}`;
      }
    }
    updateClock();
    setInterval(updateClock, 60000);
  </script>
</body>
</html>
